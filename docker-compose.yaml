# docker compose build        — build the image
# docker compose run --rm fsi  — start an interactive session (cwd /simulation = ./cases)
# docker compose up            — run a default simulation (edit command below)
#
# LaTeX report audit needs the full repo mounted:
#   ./run_report_verification.sh
#   (or: docker compose run --rm -v "$PWD:/repo" -w /repo fsi bash -lc 'cases/scripts/run_report_verification.sh')

services:
  fsi:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64   # Rosetta 2 on Apple Silicon — no native arm64 OF packages
    image: fsi-openfoam:latest
    platform: linux/amd64
    user: ubuntu          # Run as non-root so codedFixedValue BCs work (OpenFOAM blocks root)
    stdin_open: true
    tty: true
    volumes:
      # Mount your local simulation case(s) into the container
      - ./cases:/simulation
      # Mesh tooling used by the Allrun scripts (e.g. fluent_bin_to_ascii.py)
      - ./brunaStuff:/opt/brunaStuff:ro
      # Bind-mount the patched solids4foam library (fvOptions/Darcy fix in pimpleFluid).
      # See README "solids4foam pimpleFluid + fvOptions patch" for context.
      - ./cases/_lib/libsolids4FoamModels.so:/opt/of-user/lib/libsolids4FoamModels.so:ro
    working_dir: /simulation
    # Override to run a specific case directly:
    # command: bash -lc "cd myCase && ./Allrun"

