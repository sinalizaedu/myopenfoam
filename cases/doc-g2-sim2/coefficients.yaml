# Frozen coefficients — doc-g2-sim2 inherits G2 Sim 1 mesh + porous coeffs
# Source: cases/doc-g2-sim1 (calibrated 2026-07-19)

geometry: G2-fluid          # AC ∪ vitreous ∪ TM, 90° calotte
parent_case: doc-g2-sim1
mesh_level: M1
nCells_M1_pre_tip: 33906
nCells_M1_post_tip: 33891   # after ivi_tip carve (on-axis)

porous:
  d_TM: 7.779e14            # m⁻² — G2-calibrated IOP₀ ≈ 15 mmHg
  d_vit: 1.724e13           # m⁻² — κ_vit = 5.8e-14 m²
  kappa_vit: 5.8e-14        # m²

fluid:
  rho: 995                  # kg/m³ @ 37 °C
  nu: 6.925e-7              # m²/s

bcs_baseline:
  Q_prod_quarter: 1.25e-11  # m³/s = (3 µL/min)/4
  P_TM_Torr: 10
  P_TM_kinematic: 1.3399    # m²/s²

# Model B: IVI at mid-vitreous tip on optical axis (internal cavity)
# Wall: volume-matched Robin (default); rigid via WALL_BC=rigid
experiment:
  endTime: 20               # s — baseline → IVI → recovery
  phases:
    - {name: baseline,     t0: 0,  t1: 5}
    - {name: ivi,          t0: 5,  t1: 11}
    - {name: recovery_ivi, t0: 11, t1: 20}
  # Clinical bolus ≈ 50 µL / 6 s = 8.333e-9; G2 sector uses 1/4
  Q_ivi_clinical: 8.333e-9  # m³/s
  Q_ivi_quarter: 2.08325e-9 # m³/s
  # Tip cavity on optical axis → one tip in full eye
  tip_origin_m: [0.0, 0.0030, -0.00040]
  tip_radius_m: 0.00007   # 30G lumen (ID 0.14 mm)
  needle_gauge: 30G
  wall: volume_matched_robin   # Q_wall(t) = -Q_ivi(t); pressure Robin unstable
  wall_alt: noSlip             # WALL_BC=rigid
